<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="PACEÑO · Patrimonio cultural de La Paz" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Cuadrícula de cuaderno -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#C9D6E6" stroke-width="1"/>
    </pattern>

    <!-- Franja de aguayo (se desplaza) -->
    <pattern id="aguayo" width="80" height="44" patternUnits="userSpaceOnUse">
      <rect width="80" height="44" fill="#A8423C"/>
      <polygon points="0,44 20,10 40,44" fill="#F5C842"/>
      <polygon points="40,44 60,10 80,44" fill="#4FA36A"/>
      <polygon points="12,44 20,26 28,44" fill="#6FA3C7"/>
      <polygon points="52,44 60,26 68,44" fill="#D8517F"/>
      <rect y="0" width="80" height="4" fill="#2A2723"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="80 0" dur="8s" repeatCount="indefinite"/>
    </pattern>

    <!-- Flor / destello de 8 pétalos -->
    <symbol id="flor" overflow="visible">
      <ellipse rx="4" ry="15"/>
      <ellipse rx="4" ry="15" transform="rotate(45)"/>
      <ellipse rx="4" ry="15" transform="rotate(90)"/>
      <ellipse rx="4" ry="15" transform="rotate(135)"/>
      <circle r="3" fill="#F6F2E9"/>
    </symbol>

    <!-- Chakana (cruz andina escalonada) -->
    <symbol id="chakana" overflow="visible">
      <path d="M-6,-20 H6 V-12 H12 V-6 H20 V6 H12 V12 H6 V20 H-6 V12 H-12 V6 H-20 V-6 H-12 V-12 H-6 Z"/>
      <circle r="5" fill="#F6F2E9"/>
    </symbol>

    <clipPath id="frame"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'Cutive Mono','Space Mono','Courier New',Courier,monospace; }
    .display { font-family: 'Arial Black','Rubik Mono One',Impact,sans-serif; letter-spacing: 4px; }
    .label { font-size: 14px; letter-spacing: 3px; fill: #A8423C; }
    .sub { font-size: 27px; fill: #2A2723; }
    .phrase { font-size: 20px; fill: #2A2723; opacity: 0; animation: cycle 9s infinite; }
    .p2 { animation-delay: 3s; }
    .p3 { animation-delay: 6s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateX(-10px); }
      5%, 30% { opacity: 1; transform: translateX(0); }
      34%, 100% { opacity: 0; transform: translateX(10px); }
    }
    .fl { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
    .fl.rev { animation-direction: reverse; animation-duration: 18s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bob { animation: bob 4s ease-in-out infinite; }
    .bob.b2 { animation-delay: 1.3s; }
    .bob.b3 { animation-delay: 2.4s; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    .sun { transform-box: fill-box; transform-origin: center; animation: sun 3.5s ease-in-out infinite; }
    @keyframes sun { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  </style>

  <g clip-path="url(#frame)">
    <!-- Papel -->
    <rect width="1200" height="340" fill="#F6F2E9"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <!-- Márgenes rojos -->
    <line x1="56" y1="0" x2="56" y2="340" stroke="#A8423C" stroke-opacity=".65" stroke-width="2"/>
    <line x1="1144" y1="0" x2="1144" y2="340" stroke="#A8423C" stroke-opacity=".65" stroke-width="2"/>

    <!-- Sol y montañas (Illimani) -->
    <circle cx="930" cy="150" r="52" fill="#F5C842" class="sun"/>
    <path d="M690 296 L790 222 L842 258 L930 160 L1015 248 L1068 214 L1160 296 Z" fill="#FFFDF6" stroke="#2A2723" stroke-width="3" stroke-linejoin="round"/>
    <path d="M930 160 L962 196 L944 190 L930 208 L916 188 L898 194 Z" fill="#6FA3C7"/>
    <path d="M790 222 L810 240 L796 238 L784 250 L772 238 Z" fill="#6FA3C7" opacity=".8"/>

    <!-- Flores y chakanas flotantes -->
    <g class="bob"><g transform="translate(655 70)"><g class="fl" fill="#A8423C"><use href="#flor"/></g></g></g>
    <g class="bob b2"><g transform="translate(1090 78)"><g class="fl rev" fill="#4FA36A"><use href="#flor"/></g></g></g>
    <g class="bob b3"><g transform="translate(780 52)"><g class="fl" fill="#F5C842" stroke="#2A2723" stroke-width="1"><use href="#flor"/></g></g></g>
    <g class="bob b2"><g transform="translate(1030 140)"><g class="fl rev" fill="#6FA3C7"><use href="#flor"/></g></g></g>
    <g class="bob"><g transform="translate(1100 190)"><g class="fl" fill="#D8517F"><use href="#chakana"/></g></g></g>
    <g class="bob b3"><g transform="translate(640 200)"><g class="fl rev" fill="#4FA36A"><use href="#chakana"/></g></g></g>

    <!-- Textos -->
    <text x="96" y="58" class="mono label">// LA PAZ · BOLIVIA · PWA</text>

    <g class="display" font-size="112" font-weight="900">
      <text x="101" y="175" fill="#2A2723" stroke="#2A2723" stroke-width="8" stroke-linejoin="round">PACEÑO</text>
      <text x="96" y="170" fill="#A8423C" stroke="#FFFDF6" stroke-width="7" stroke-linejoin="round" paint-order="stroke">PACEÑO</text>
    </g>

    <text x="96" y="222" class="mono sub">Descubre el <tspan fill="#A8423C">p</tspan><tspan fill="#F5C842">a</tspan><tspan fill="#4FA36A">t</tspan><tspan fill="#6FA3C7">r</tspan><tspan fill="#D8517F">i</tspan><tspan fill="#A8423C">m</tspan><tspan fill="#F5C842">o</tspan><tspan fill="#4FA36A">n</tspan><tspan fill="#6FA3C7">i</tspan><tspan fill="#D8517F">o</tspan> paceño</text>

    <text x="96" y="262" class="mono phrase">&gt; mapa interactivo del centro de La Paz_</text>
    <text x="96" y="262" class="mono phrase p2">&gt; fichas con fuentes documentales_</text>
    <text x="96" y="262" class="mono phrase p3">&gt; tu ciudad, explicada paso a paso_</text>

    <!-- Franja de aguayo -->
    <rect x="0" y="296" width="1200" height="44" fill="url(#aguayo)"/>

    <!-- Marco -->
    <rect x="1.5" y="1.5" width="1197" height="337" rx="20" fill="none" stroke="#2A2723" stroke-width="3"/>
  </g>
</svg>
