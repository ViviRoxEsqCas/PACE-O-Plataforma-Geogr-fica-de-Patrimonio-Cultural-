<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="100%" role="img" aria-label="Paleta de color de Paceño" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t { font-family: 'Cutive Mono','Space Mono','Courier New',monospace; font-size: 15px; fill: #2A2723; }
    .h { font-family: 'Cutive Mono','Space Mono','Courier New',monospace; font-size: 12px; fill: #6b645b; }
    .sw { stroke: #2A2723; stroke-width: 2.5; transform-box: fill-box; transform-origin: center; animation: pop 5s ease-in-out infinite; }
    .s2 { animation-delay: .3s; } .s3 { animation-delay: .6s; } .s4 { animation-delay: .9s; }
    .s5 { animation-delay: 1.2s; } .s6 { animation-delay: 1.5s; } .s7 { animation-delay: 1.8s; }
    @keyframes pop { 0%,12%,100% { transform: translateY(0); } 6% { transform: translateY(-8px); } }
  </style>
  <rect width="1200" height="170" fill="#F6F2E9"/>

  <g>
    <rect class="sw" x="30" y="24" width="130" height="84" rx="10" fill="#A8423C"/>
    <text class="t" x="30" y="132">Rojo aguayo</text><text class="h" x="30" y="152">#A8423C · principal</text>

    <rect class="sw s2" x="200" y="24" width="130" height="84" rx="10" fill="#F5C842"/>
    <text class="t" x="200" y="132">Maíz</text><text class="h" x="200" y="152">#F5C842</text>

    <rect class="sw s3" x="370" y="24" width="130" height="84" rx="10" fill="#4FA36A"/>
    <text class="t" x="370" y="132">Valle</text><text class="h" x="370" y="152">#4FA36A</text>

    <rect class="sw s4" x="540" y="24" width="130" height="84" rx="10" fill="#6FA3C7"/>
    <text class="t" x="540" y="132">Lago</text><text class="h" x="540" y="152">#6FA3C7</text>

    <rect class="sw s5" x="710" y="24" width="130" height="84" rx="10" fill="#D8517F"/>
    <text class="t" x="710" y="132">Kantuta</text><text class="h" x="710" y="152">#D8517F</text>

    <rect class="sw s6" x="880" y="24" width="130" height="84" rx="10" fill="#2F6B45"/>
    <text class="t" x="880" y="132">Verde hoja</text><text class="h" x="880" y="152">#2F6B45 · botones</text>

    <rect class="sw s7" x="1050" y="24" width="120" height="84" rx="10" fill="#2A2723"/>
    <text class="t" x="1050" y="132">Tinta</text><text class="h" x="1050" y="152">#2A2723 · texto</text>
  </g>
</svg>
