# Despliegue SIN COSTO de PACEÑO: un servicio web gratuito de Render (API + PWA).
# El plan gratuito de Render no incluye base de datos duradera ni disco, así que se usan servicios externos gratuitos:
#   · PostgreSQL → Neon (DATABASE_URL)        · Fotos y banners → Supabase Storage u otro S3 (S3_*)
# El servicio gratuito se duerme tras 15 min sin visitas y tarda cerca de 1 min en despertar.
services:
  - type: web
    name: paceno
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/categorias/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Render termina HTTPS y reescribe X-Forwarded-Proto; hay exactamente 1 proxy delante de Django.
      - key: USAR_X_FORWARDED_PROTO
        value: "True"
      - key: NUM_PROXIES
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_DOMAIN
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
